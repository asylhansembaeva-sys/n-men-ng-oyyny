<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta property="og:title" content="Н мен Ң дыбыстарын ажырат!"><title>Н мен Ң дыбыстарын ажырат!</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Times New Roman',serif;background:linear-gradient(125deg,#fff2a9,#d8f6ff 50%,#f9d7ff);color:#17336d;text-align:center;min-height:100vh}header{padding:14px 10px 2px}h1{font-size:clamp(28px,5vw,54px);margin:5px;color:#1546ae;text-shadow:1px 2px #fff}h2{font-size:clamp(26px,4vw,42px);margin:10px}.tabs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.btn{font: bold clamp(20px,2.5vw,30px) 'Times New Roman';border:3px solid #fff;border-radius:18px;padding:12px 23px;background:#ffdc3f;color:#164294;box-shadow:0 5px 0 #d1a923;cursor:pointer;touch-action:manipulation}.btn.active{background:#ff5a98;color:white;box-shadow:0 5px 0 #bd3670}.btn:disabled{opacity:.45}.panel{margin:18px auto;max-width:1150px;width:95%;padding:16px;border:5px solid #4c9be5;border-radius:28px;background:#ffffffd9;min-height:420px}.counter{font:bold 24px 'Times New Roman';color:#7a379b}.train{display:flex;align-items:stretch;justify-content:center;gap:7px;flex-wrap:wrap;margin:32px 0 25px}.engine{font-size:clamp(65px,11vw,130px);line-height:1}.wagon{border:5px solid #2768d6;border-radius:22px;background:#ffde51;padding:20px 25px;min-width:140px;font-size:clamp(45px,8vw,90px);font-weight:bold;position:relative;box-shadow:0 10px 0 #e3a938}.wagon:nth-child(3){background:#ffb7dc}.wagon:after{content:'●  ●';position:absolute;bottom:-28px;left:25%;color:#345a8b;font-size:28px;letter-spacing:20px}.hint{font-size:clamp(21px,3vw,32px);font-weight:bold;color:#7c3894}.controls{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:26px auto}.word{font-weight:bold;font-size:clamp(60px,10vw,122px);margin:18px auto;color:#153d9e;letter-spacing:2px}.blank{display:inline-block;min-width:1em;border-bottom:8px solid #e54c91;color:#e54c91}.choices{display:flex;justify-content:center;gap:30px;margin:20px auto;flex-wrap:wrap}.letter{background:#fdf6ff;border:6px solid #e94c91;border-radius:22px;color:#075bd8;font:bold clamp(70px,10vw,125px) 'Times New Roman';width:clamp(120px,23vw,210px);height:clamp(120px,23vw,180px);cursor:grab;touch-action:none;user-select:none;box-shadow:0 8px 0 #f7b4d2}.letter:active{cursor:grabbing}.target{color:#075bd8;display:inline-flex;justify-content:center;align-items:center;border:5px dashed #e94c91;border-radius:18px;min-width:1.2em;min-height:1.1em;background:#fff5d6}.message{font:bold clamp(28px,5vw,50px) 'Times New Roman';min-height:65px;color:#df2781}.note{font-size:20px;color:#475a83}.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.spark{position:absolute;font-size:32px;animation:fly 1.15s ease-out forwards}@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(360deg) scale(1.4);opacity:0}}@media(max-width:600px){.panel{padding:9px;min-height:420px}.train{margin:40px 0 35px}.wagon{min-width:105px;padding:14px 12px}.engine{width:100%}.word{font-size:clamp(52px,13vw,85px)}.letter{width:125px;height:125px}.btn{padding:11px 15px}}
</style></head><body><header><h1>Н мен Ң дыбыстарын ажырат!</h1><div class="tabs"><button class="btn active" id="tab1" onclick="openStage(1)">1-КЕЗЕҢ</button><button class="btn" id="tab2" onclick="openStage(2)">2-КЕЗЕҢ</button></div></header><main class="panel" id="main"></main><div class="burst" id="burst"></div><script>
const pairs=[["он","оң"],["тон","тоң"],["күн","күң"],["мен","мең"],["шын","шың"],["ен","ең"],["тын","тың"],["қон","қоң"],["сын","сың"],["өн","өң"],["кен","кең"],["атын","атың"],["ойын","ойың"],["көзін","көзің"],["түнін","түнің"],["сен","сең"],["шыны","шыңы"],["жанын","жаның"],["тан","таң"],["сан","саң"]];
const tasks=[["ана",1,"н"],["аң",1,"ң"],["дән",2,"н"],["таң",2,"ң"],["шана",2,"н"],["теңге",2,"ң"],["емен",3,"н"],["қоңыр",2,"ң"],["айна",2,"н"],["шаң",2,"ң"],["анар",1,"н"],["еңбек",1,"ң"],["алтын",4,"н"],["шаңғы",2,"ң"],["дана",2,"н"],["мың",2,"ң"],["сусын",4,"н"],["қаңбақ",2,"ң"],["қанша",2,"н"],["қайың",4,"ң"],["әуен",3,"н"],["қоңырау",2,"ң"],["орындық",3,"н"],["шаңырақ",2,"ң"],["қауын",4,"н"],["жаңбыр",2,"ң"],["құндыз",2,"н"],["қоңыз",2,"ң"],["жаңа",2,"ң"],["әңгіме",1,"ң"]];
let stage=1,p=0,t=0,busy=false,wait=null,dragged=null,audio;function tone(ok){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let now=audio.currentTime;let notes=ok?[523,659,784,1046]:[260,195];notes.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.12);g.gain.exponentialRampToValueAtTime(.13,now+i*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.12+.17);o.connect(g);g.connect(audio.destination);o.start(now+i*.12);o.stop(now+i*.12+.19)})}catch(e){}}
function fireworks(){let b=document.getElementById('burst');b.innerHTML='';for(let i=0;i<40;i++){let s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','🎉','🌟','💖'][i%5];s.style.left=(30+Math.random()*40)+'%';s.style.top=(28+Math.random()*35)+'%';s.style.setProperty('--x',(Math.random()*900-450)+'px');s.style.setProperty('--y',(Math.random()*750-375)+'px');b.append(s)}setTimeout(()=>b.innerHTML='',1200)}
function openStage(n){clearTimeout(wait);stage=n;busy=false;document.getElementById('tab1').classList.toggle('active',n===1);document.getElementById('tab2').classList.toggle('active',n===2);render()}
function render(){if(stage===1){let a=pairs[p];document.getElementById('main').innerHTML=`<h2>🚂 Буындар пойызы</h2><div class="counter">${p+1} / ${pairs.length}</div><div class="train"><div class="engine">🚂</div><div class="wagon">${a[0]}</div><div class="wagon">${a[1]}</div></div><div class="hint">Буындарды салыстырып оқы!</div><div class="controls"><button class="btn" onclick="p=0;render()">ҚАЙТА ОЙНАТУ</button><button class="btn" onclick="p=(p+1)%pairs.length;render()">КЕЛЕСІ ➜</button><button class="btn" onclick="openStage(2)">2-КЕЗЕҢГЕ ӨТУ</button></div>`;return}
if(t>=tasks.length){document.getElementById('main').innerHTML=`<h2>🎉 ЖАРАЙСЫҢ!</h2><div class="hint">Барлық 30 тапсырманы орындадың!</div><div class="controls"><button class="btn" onclick="t=0;busy=false;render()">ҚАЙТА ОЙНАУ</button><button class="btn" onclick="openStage(1)">1-КЕЗЕҢ</button></div>`;return}
let [w,pos]=tasks[t],part=w.slice(0,pos),end=w.slice(pos+1);document.getElementById('main').innerHTML=`<h2>Жоғалған әріпті тап!</h2><div class="counter">${t+1} / 30</div><div class="word">${part}<span class="target" id="target">_</span>${end}</div><div class="choices"><button class="letter" data-letter="н">н</button><button class="letter" data-letter="ң">ң</button></div><div class="message" id="msg"></div><div class="controls"><button class="btn" onclick="t=0;busy=false;render()">ҚАЙТА ОЙНАУ</button><button class="btn" onclick="nextTask()">КЕЛЕСІ ➜</button></div><div class="note">Әріпті басуға да, бос орынға сүйреуге де болады.</div>`;document.querySelectorAll('.letter').forEach(el=>{el.addEventListener('click',()=>choose(el.dataset.letter));el.addEventListener('pointerdown',startDrag)})}
function nextTask(){clearTimeout(wait);busy=false;t++;render()}
function choose(c){if(stage!==2||busy)return;let [w,pos,ans]=tasks[t];if(c!==ans){document.getElementById('msg').textContent='Қайта байқап көр!';tone(false);return}busy=true;document.getElementById('target').textContent=c;document.getElementById('msg').textContent='ЖАРАЙСЫҢ!';tone(true);fireworks();wait=setTimeout(()=>{t++;busy=false;render()},1900)}
function startDrag(e){if(busy)return;if(e.pointerType==='mouse'&&e.button!==0)return;let el=e.currentTarget,originX=e.clientX,originY=e.clientY,clone=null,started=false;el.setPointerCapture(e.pointerId);const move=ev=>{if(!started&&Math.hypot(ev.clientX-originX,ev.clientY-originY)>12){started=true;clone=el.cloneNode(true);clone.style.cssText='position:fixed;z-index:50;pointer-events:none;opacity:.85;transform:translate(-50%,-50%);margin:0';document.body.append(clone)}if(clone){clone.style.left=ev.clientX+'px';clone.style.top=ev.clientY+'px'}};const up=ev=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);if(clone)clone.remove();if(started){let target=document.getElementById('target'),r=target.getBoundingClientRect();if(ev.clientX>=r.left-35&&ev.clientX<=r.right+35&&ev.clientY>=r.top-35&&ev.clientY<=r.bottom+35)choose(el.dataset.letter)}};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
render();</script></body></html>
